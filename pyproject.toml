[project]
name = "research-assistant"
version = "0.1.0"
description = "Cited IEEE bilingual research brief generator (OpenAI + LangGraph + Streamlit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "requests>=2.31",
    "feedparser>=6.0",
    "streamlit>=1.37",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that call live external APIs (deselect with '-m \"not integration\"')",
]
